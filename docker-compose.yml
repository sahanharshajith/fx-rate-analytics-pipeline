services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fx_mssql
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      retries: 10
      start_period: 15s

  airflow:
    build:
      context: ./airflow
    container_name: fx_airflow
    depends_on:
      mssql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - MSSQL_SERVER=${MSSQL_SERVER}
      - MSSQL_PORT=${MSSQL_PORT}
      - MSSQL_USER=${MSSQL_USER}
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - MSSQL_DATABASE=${MSSQL_DATABASE}
      - MSSQL_ENCRYPT=${MSSQL_ENCRYPT}
      - MSSQL_TRUST_CERT=${MSSQL_TRUST_CERT}
      - FRANKFURTER_URL=${FRANKFURTER_URL}
      - OPEN_ER_URL=${OPEN_ER_URL}
      - BASE_CURRENCY=${BASE_CURRENCY}
    volumes:
      - .:/opt/airflow/project
      - airflow_home:/opt/airflow/home

  backend:
    build:
      context: ./backend
    container_name: fx_backend
    depends_on:
      mssql:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - MSSQL_SERVER=${MSSQL_SERVER}
      - MSSQL_PORT=${MSSQL_PORT}
      - MSSQL_USER=${MSSQL_USER}
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - MSSQL_DATABASE=${MSSQL_DATABASE}
      - CORS_ORIGIN=http://localhost:3000

  dashboard:
    build:
      context: ./dashboard
    container_name: fx_dashboard
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - INTERNAL_API_URL=http://backend:8000

volumes:
  mssql_data:
  airflow_home: