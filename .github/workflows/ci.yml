name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install flake8
        run: pip install flake8
      - name: Lint
        run: flake8 python_app ml backend spark/jobs

  dbt-parse-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ODBC Driver 18 for SQL Server
        run: |
          curl -sSL -O https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          rm packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev

      - name: Install dbt
        run: pip install dbt-sqlserver

      - name: Write CI dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          dbt_fx:
            target: ci
            outputs:
              ci:
                type: sqlserver
                driver: "ODBC Driver 18 for SQL Server"
                server: localhost
                port: 1433
                database: FxAnalytics
                schema: gold
                UID: sa
                PWD: placeholder_not_real
                encrypt: True
                trust_cert: True
                threads: 1
          EOF

      - name: dbt parse
        working-directory: dbt_fx
        run: dbt parse